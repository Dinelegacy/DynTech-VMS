# MediaMTX Configuration File
logLevel: info
logDestinations: [stdout]
logFile: mediamtx.log

# RTSP Server Settings
rtsp: yes
protocols: [tcp, udp]
rtspAddress: :8554

# WebRTC Server Settings (for web playback)
webrtc: yes
webrtcAddress: :8889

# HLS Server Settings
hls: yes
hlsAddress: :8888

# Path Configurations
paths:
  test-cam-01:
    source: publisher
    publishUser: ""
    publishPass: ""

  all_others: {}