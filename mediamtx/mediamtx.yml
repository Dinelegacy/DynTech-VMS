# MediaMTX Configuration File
logLevel: info
logDestinations: [stdout]
logFile: mediamtx.log

# Allow anonymous publishing and playback
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback

# RTSP Server Settings
rtsp: yes
protocols: [tcp, udp]
rtspAddress: :8554

# WebRTC Server Settings
webrtc: yes
webrtcAddress: :8889

# HLS Server Settings
hls: yes
hlsAddress: :8888

# Path Configurations
paths:
  live:
    source: publisher
  all_others: {}